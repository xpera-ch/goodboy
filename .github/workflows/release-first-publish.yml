# FIRST PUBLISH ONLY — used to bootstrap Trusted Publishing
# After v0.1.0 is published and Trusted Publishing is
# configured on npmjs.com, delete this file and use
# release.yml for all future releases.

name: Release (First Publish)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['24', '26']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate types
        run: npm run generate:types

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Coverage
        run: npm run test:coverage

  publish:
    name: Publish to npm
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Generate types
        run: npm run generate:types

      - name: Build all packages
        run: npm run build

      - name: Publish @goodboyjs/schema
        run: npm publish --workspace packages/schema --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @goodboyjs/registry-client
        run: npm publish --workspace packages/registry-client --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @goodboyjs/cli
        run: npm publish --workspace packages/cli --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${TAG#v}" >> $GITHUB_OUTPUT
        env:
          TAG: ${{ github.event.inputs.tag }}

      - name: Extract changelog section
        id: changelog
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          # Extract the section for this version from CHANGELOG.md
          # Matches from ## [VERSION] to the next ## [ line
          NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} \
            found && /^## \[/{exit} \
            found{print}" CHANGELOG.md)
          # Write to file to handle multiline safely
          echo "$NOTES" > release_notes.txt
          echo "NOTES_FILE=release_notes.txt" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: GoodBoy ${{ github.event.inputs.tag }}
          body_path: release_notes.txt
          draft: false
          prerelease: false
