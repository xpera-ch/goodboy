name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate types
        run: npm run generate:types

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Coverage
        run: npm run test:coverage

  publish:
    name: Publish to npm
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write    # Required for OIDC Trusted Publishing
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm for OIDC Trusted Publishing support
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Generate types
        run: npm run generate:types

      - name: Build all packages
        run: npm run build

      # Each publish step skips versions that are already on npm, so a tag can
      # release any subset of packages (no lockstep versioning) and a failed
      # workflow can be re-run safely without publish conflicts.
      - name: Publish @goodboyjs/schema
        run: |
          VERSION=$(node -p "require('./packages/schema/package.json').version")
          if npm view "@goodboyjs/schema@$VERSION" version >/dev/null 2>&1; then
            echo "@goodboyjs/schema@$VERSION already published — skipping"
          else
            npm publish --workspace packages/schema --access public --provenance
          fi

      - name: Publish @goodboyjs/registry-client
        run: |
          VERSION=$(node -p "require('./packages/registry-client/package.json').version")
          if npm view "@goodboyjs/registry-client@$VERSION" version >/dev/null 2>&1; then
            echo "@goodboyjs/registry-client@$VERSION already published — skipping"
          else
            npm publish --workspace packages/registry-client --access public --provenance
          fi

      - name: Publish @goodboyjs/cli
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          if npm view "@goodboyjs/cli@$VERSION" version >/dev/null 2>&1; then
            echo "@goodboyjs/cli@$VERSION already published — skipping"
          else
            npm publish --workspace packages/cli --access public --provenance
          fi

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Extract changelog section
        id: changelog
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          # Extract the section for this version from CHANGELOG.md
          # Matches from ## [VERSION] to the next ## [ line
          NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} \
            found && /^## \[/{exit} \
            found{print}" CHANGELOG.md)
          # Write to file to handle multiline safely
          echo "$NOTES" > release_notes.txt
          echo "NOTES_FILE=release_notes.txt" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: GoodBoy ${{ github.ref_name }}
          body_path: release_notes.txt
          draft: false
          prerelease: false
